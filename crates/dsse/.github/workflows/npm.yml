name: npm

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/npm-package.yml
    secrets:
      DSSE_FORBIDDEN_SHA256: ${{ secrets.DSSE_FORBIDDEN_SHA256 }}

  provenance:
    if: github.repository == 'probityai/dsse' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/npm-qualified
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: bind the qualified package subject and digest
        id: identity
        env:
          QUALIFIED_RECEIPTS: ${{ runner.temp }}/npm-qualified
          VERIFIED_NPM: ${{ runner.temp }}/verified-npm.json
        run: |
          python3 npm/check_release.py "$QUALIFIED_RECEIPTS" --commit "$GITHUB_SHA" > "$VERIFIED_NPM"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          verified = json.loads(Path(os.environ['VERIFIED_NPM']).read_text())
          manifest = json.loads(Path('npm/package.json').read_text())
          assert manifest['name'] == 'dsse'
          tarball = Path(verified['tarball']).read_bytes()
          assert hashlib.sha256(tarball).hexdigest() == verified['sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('subject=pkg:npm/' + manifest['name'] + '@' + manifest['version'] + '\n')
              output.write('digest=sha512:' + hashlib.sha512(tarball).hexdigest() + '\n')
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        id: attest
        with:
          subject-name: ${{ steps.identity.outputs.subject }}
          subject-digest: ${{ steps.identity.outputs.digest }}
      - name: retain the signed npm provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dsse-npm-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ steps.attest.outputs.bundle-path }}
