[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "probityai"
version = "0.1.0"
description = "Canonical JSON admission (RFC 8785) for evidence records, from the jcs-admit Rust crate"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
requires-python = ">=3.10"
keywords = ["jcs", "rfc8785", "canonicalization", "attestation", "in-toto"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/probityai/jcs-admit/tree/main/python"
Issues = "https://github.com/probityai/jcs-admit/issues"

[dependency-groups]
dev = ["maturin==1.15.0", "pytest==9.1.1", "mypy==2.4.0"]

[tool.maturin]
module-name = "probityai._native"
python-source = "pysrc"

[tool.uv]
# Rebuild the extension whenever `uv sync` or `uv run` finds the Rust source changed.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
