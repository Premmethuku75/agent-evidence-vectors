name: python

# Builds and tests the Python bindings in python/ (the probityai wheel, which links
# the published jcs-admit and dsse crates) and the jcs-admit twin in python/twin/.
#
#   python-test    lint, the full test suite and the type-stub check, from source,
#                  on the oldest and newest CPython the abi3 wheel serves;
#   python-msrv    the binding builds on the rust-version in python/Cargo.toml;
#   python-wheels  one abi3 wheel per platform (manylinux 2_28 and musllinux 1_2 on
#                  x86_64 and aarch64, macOS on both, Windows x64) plus the sdist,
#                  and the twin's wheel and sdist;
#   python-wheel-test  installs each runnable wheel into a clean environment, with
#                  no source on the path, and runs the whole suite against it, then
#                  installs the twin from the built files alone.
#
# Nothing here publishes. A release is a separate, deliberate step.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: "0.12.8"
  MATURIN_VERSION: "v1.15.0"
  BINDING_MSRV: "1.88"

jobs:
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install stable with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: uv sync --locked
      - run: uv run --locked pytest
      - name: the type stub matches the built extension
        run: uv run --locked python -m mypy.stubtest probityai._native
      - name: the twin, against the binding built from this tree
        working-directory: python/twin
        run: |
          uv sync --locked
          uv run --locked pytest

  python-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the declared rust-version is the one in Cargo.toml
        run: grep -qx "rust-version = \"$BINDING_MSRV\"" Cargo.toml
      - run: rustup toolchain install "$BINDING_MSRV" --profile minimal
      - run: cargo "+$BINDING_MSRV" check --locked

  python-wheels:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin, manylinux: "" }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64-apple-darwin, manylinux: "" }
          - { name: windows-x86_64, runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-wheel-${{ matrix.name }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 30

  python-sdists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: python
          command: sdist
          args: --out dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: build the twin's wheel and sdist
        working-directory: python/twin
        run: uv build --out-dir ../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdists-and-twin
          path: python/dist/*
          if-no-files-found: error
          retention-days: 30

  python-wheel-test:
    needs: [python-wheels, python-sdists]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wheel: manylinux-x86_64, runner: ubuntu-latest, python: "3.10" }
          - { wheel: manylinux-x86_64, runner: ubuntu-latest, python: "3.14" }
          - { wheel: manylinux-aarch64, runner: ubuntu-24.04-arm, python: "3.14" }
          - { wheel: macos-aarch64, runner: macos-latest, python: "3.14" }
          - { wheel: windows-x86_64, runner: windows-latest, python: "3.14" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-wheel-${{ matrix.wheel }}
          path: built
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-sdists-and-twin
          path: built
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: one abi3 wheel, tagged for CPython 3.10 and later
        run: |
          ls built
          wheels=(built/probityai-0.1.0-cp310-abi3-*.whl)
          test "${#wheels[@]}" -eq 1 && test -f "${wheels[0]}"
      - name: install the built files only, with nothing from the source tree
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" --no-index --only-binary :all: --find-links built jcs-admit==0.1.2
          uv pip install --python "$RUNNER_TEMP/venv" pytest==9.1.1
      - name: the whole suite against the installed wheel
        run: |
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -c "import probityai, pathlib; p = pathlib.Path(probityai.__file__).resolve(); assert 'site-packages' in p.parts, p; print(p)"
          "$py" -m pytest python/tests python/twin/tests -p no:cacheprovider
