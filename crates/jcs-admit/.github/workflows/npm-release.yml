name: release npm

on:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/npm-package.yml

  publish:
    if: github.repository == 'probityai/jcs-admit'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: require a matching npm tag on main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('npm/package.json').read_text())['version']
          assert os.environ['GITHUB_REF_TYPE'] == 'tag'
          assert os.environ['RELEASE_TAG'] == 'npm-v' + version
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/jcs-qualified
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: verify the exact qualified artifact
        id: artifact
        env:
          QUALIFIED_RECEIPTS: ${{ runner.temp }}/jcs-qualified
          VERIFIED_NPM: ${{ runner.temp }}/jcs-verified-npm.json
        run: |
          python3 npm/check_release.py "$QUALIFIED_RECEIPTS" --commit "$GITHUB_SHA" > "$VERIFIED_NPM"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path(os.environ['VERIFIED_NPM']).read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tarball=' + record['tarball'] + '\n')
          PY
      - name: publish the tested bytes with npm trusted publishing
        env:
          QUALIFIED_TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: npm publish "$QUALIFIED_TARBALL" --access public --provenance --ignore-scripts
