# Workspace root for the Python distributions under packages/. It is not a
# package: each member declares its own distribution, version, licence and
# release tag, and uv resolves every member into the one uv.lock beside this
# file. A directory under packages/ without a pyproject.toml is refused by uv,
# so a member is added together with its manifest.

[project]
# Never built or published (package = false below); it carries only the
# Python floor every member must support.
name = "agent-evidence-workspace"
version = "0"
requires-python = ">=3.10"

[tool.uv.workspace]
# A package whose Python distribution sits in a subdirectory names that
# subdirectory, and its top directory is excluded.
members = ["packages/*", "packages/admission/python"]
exclude = ["packages/admission"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

# The root ruff run covers the repository tools and the uv members. A crate under
# crates/ brings its own checks (crate-<name>.yml), which ruff was never part of.
# The repository tools read TOML with tomllib, which needs Python 3.11.
[tool.ruff]
target-version = "py311"
extend-exclude = ["crates"]
