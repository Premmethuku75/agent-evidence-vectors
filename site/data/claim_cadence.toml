# How long each claim-ledger row stays current after its read time.
#
# tools/build.py stamps every row of CLAIMS.md that has a read time with its cadence, and
# the claim-ledger page marks a row stale when the reader's clock is past read date plus
# cadence. A row with a read time and no entry here fails the build, so a new row cannot
# go unclassified.
#
# The rule, as the ledger states it: star counts, pull-request and issue states and link
# checks change weekly (7 days); standards and project statuses, descriptions and labels
# monthly (30 days); published versions, dated events, content pinned to a tag and the
# site's own data do not expire ("none").

[cadence]
# 7 days
"A-02" = 7
"A-06" = 7
"A-07" = 7
"A-08" = 7
"A-09" = 7
"A-stars" = 7
"A-39" = 7
"A-40" = 7
"L-01" = 7
"L-02" = 7
# 30 days
