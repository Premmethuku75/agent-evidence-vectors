# Data behind atlas.html. tools/gen_atlas.py renders it into src/atlas.md through
# templates/atlas.md.in; never edit src/atlas.md by hand.
#
# Shape: nodes with a type (layer, entry, mechanism, artifact, corpus, contribution,
# listing) and edges carried as fields (entry.layer, mechanism.layer,
# artifact.layers). The shape is chosen so the page can later be generated from an
# exported property graph: every node has an id, a type, a title, a url and, where it
# was measured, a value with its read time and source.
#
# Size rule for naming: a standard from a recognised body, or an
# organisation-owned project measured at roughly 500 GitHub stars or more.
# Every `stars` value carries `read`, and tools/rederive.py re-reads every entry
# that has a `repo`.

[meta]
version = "0.2"
read_window = "2026-09-27 00:40 to 01:00 UTC"

# ---------------------------------------------------------------- layers
[[layer]]
id = "L1"
name = "Identity and authorization"
job = "policy"
question = "Who, or what workload, is making this request, and on whose delegated authority?"
short_question = "Who is making this request, on whose authority?"
establishes = "That a request carried a credential bound to an identity a trusted issuer vouched for, and, through delegation or token exchange, the principal it acts for and the scope it was granted."
short_establishes = "A credential from a trusted issuer is bound to an identity and a delegated scope"
cannot = "That the holder is the agent it claims to be once a key or token leaves its workload; what the agent did with the authority; or whether a particular action matched what the principal intended. An identity is a precondition for accountability. It is never a record of conduct."
short_cannot = "What was done with the authority, or whether an action matched the principal's intent"
seam = "The policy engine decides on the identity it is shown, and that identity usually names a workload, not a task. When a user delegates to an agent, which calls a tool, which calls a sub-agent, the token at the enforcement point often carries the agent's own identity and a broad scope. The human principal, the narrowing at each hop and the purpose of the call are lost or merely asserted. Policy then approves \"this workload may call this tool\". Whether the call was within what the user delegated for this task falls between the layers."

[[layer]]
id = "L2"
name = "Policy and runtime control"
job = "policy"
question = "Given who is asking, is this specific action permitted right now?"
short_question = "Is this action permitted right now?"
establishes = "That a request which reached an enforcement point was evaluated against a stated policy, and allowed or denied."
short_establishes = "A request that reached the enforcement point was evaluated and allowed or denied"
cannot = "Anything about requests that never passed through that point, anything about what happened after an allow, or that the policy was right. The decision log is written by the decider, so it reports the decision; it does not witness the effect."
short_cannot = "Anything about requests that bypassed the point, or what happened after an allow"
seam = "Policy judges the action as declared at the gateway. Containment governs what the process can actually reach. Whatever the agent does without crossing the gateway, such as code it runs inside an allowed tool, a direct socket, or a file a later step reads, is invisible to the policy engine. The decision and the effect happen in different places at different times, and nothing binds one to the other."

[[layer]]
id = "L3"
name = "Containment"
job = "containment"
question = "If the agent or its tools misbehave, what can they reach?"
short_question = "If the agent misbehaves, what can it reach?"
establishes = "That execution was restricted: the system calls, files, network destinations and memory it could touch were bounded, which bounds the damage."
short_establishes = "Execution was bounded to certain calls, files and destinations"
cannot = "What happened inside the allowed boundary. A sandbox restricts; it does not witness. It cannot show by itself that it was in place for a particular run, which needs attestation from outside it, and an escape it did not detect looks exactly like no escape."
short_cannot = "What happened inside the boundary, or that the boundary was in place for a given run"
seam = "The contained process is also the process that reports on itself. Traces come from instrumentation inside the sandboxed workload, so a denied connection, a killed process, or a tool that did something other than what it logged produces no span, and the trace still looks complete. Containment and observation sit at different vantage points, and neither reports what the other saw."

[[layer]]
id = "L4"
name = "Tracing and observability"
job = "evidence (self-reported)"
question = "What did the agent report doing, in what order, with what inputs and outputs?"
short_question = "What did the agent report doing?"
establishes = "What the instrumentation emitted: correlated spans, timings and attributes, as reported."
short_establishes = "What the instrumentation emitted, correlated and timed"
cannot = "That the events happened independently of the party emitting them; that nothing is missing, since tracing has no concept of a missing span and sampling drops spans by design; or that the record is intact, since spans are unsigned and can change anywhere in the collection pipeline. A trace is written by the party it describes."
short_cannot = "That the events occurred independently of the emitter, or that nothing is missing"
seam = "Signing a trace fixes its bytes. It does not make the trace true or complete. Whatever the emitter left out before signing stays out, and the signed version now carries more authority than the unsigned one did. A receipt over a self-report is an integrity-protected self-report."

[[layer]]
id = "L5"
name = "Receipts and transparency"
job = "evidence (integrity)"
question = "Can a third party check, later and offline, that this record is exactly the one that was issued, by whom, and that the issuer did not show different records to different parties?"
short_question = "Is this record exactly the one that was issued, and by whom?"
establishes = "Integrity and origin of bytes: the holder of a key signed exactly these bytes. A transparency log adds that an entry was included at a point in the log's history and that the history was not rewritten, which prevents equivocation for anyone who checks."
short_establishes = "Integrity and origin of bytes; with a log, that the history was not rewritten"
cannot = "That what the bytes describe occurred; that the set of records is complete; that the content is true; or that the signer observed anything at all."
short_cannot = "That the described events occurred, that the record is complete, or that the signer observed anything"
seam = "A receipt proves which bytes were issued. An evaluation measures how a system behaved. The two are rarely bound: an evaluation result seldom names, by digest, the weights, scaffold, tools, configuration and grader it ran against, and a production receipt seldom points back to the evaluation that licensed the deployment. \"This deployed agent is the one that was evaluated\" is asserted, not checkable."

[[layer]]
id = "L6"
name = "Evaluation"
job = "scrutiny"
question = "Before and during deployment, how does this system behave on tasks designed to draw out the capabilities and failures that matter, and who measured it?"
short_question = "How does this system behave on tests designed to find failures?"
establishes = "Measured behavior of a specific system version, under a specific harness and task set, at a specific time."
short_establishes = "Measured behavior of one version, under one harness, at one time"
cannot = "Behavior in deployment; that the evaluated system is the deployed one, unless the two are bound by digest; the absence of capabilities it did not test; or the soundness of its own result, unless someone else can recompute it from preserved inputs."
short_cannot = "Behavior in deployment, or that the deployed system is the one tested"
seam = "Governance texts name outcomes such as record-keeping, testing, logging and third-party assessment, without fixing an evidence format, a required vantage, or a way for a regulator to re-check a result. The European harmonised standards that would give a presumption of conformity are, on CEN-CENELEC's own page, still under development. Evaluator independence is now being written down as operating conditions; whether the evidence an evaluator produces can be re-checked is not."

[[layer]]
id = "L7"
name = "Governance and standards"
job = "scrutiny"
question = "What must be true of an AI system, who must show it, and to whom?"
short_question = "What must be true, who must show it, and to whom?"
establishes = "Obligations, risk categories, process requirements and routes to conformity."
short_establishes = "Obligations, risk categories and routes to conformity"
cannot = "That any obligation was met. Several instruments are voluntary, several rest on standards not yet published, and none specifies evidence that a distrusting party could re-check."
short_cannot = "That any obligation was met"
seam = "Accountability obligations end in a person or an organization. The record that would show which principal authorized which agent action is not something any of these instruments requires in a checkable form. The chain from \"this obligation applies to the deployer\" back to \"this delegation authorized this call\" is closed by documentation, not by evidence."

