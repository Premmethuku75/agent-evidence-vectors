# ---------------------------------------------------------------- mechanisms
# writer: who writes the record the mechanism produces, in the vocabulary's
# witness_scope terms. SELF = the observed party (the agent, or the system that
# runs it). PEER = a party alongside it with its own stake (a gateway operator, an
# evaluator paid by the lab). EXTERNAL = a party outside the observed system's
# control. The assignment is this atlas's reading of the typical deployment, not a
# property of the software.
[[mechanism]]
name = "Workload identity document (for example a SPIFFE SVID)"
layer = "L1"
writer = "EXTERNAL issuer, about the workload"
establishes = "The issuer attested the workload's identity at issuance"
cannot = "Anything the workload did afterwards"
[[mechanism]]
name = "Delegated token (OAuth token exchange)"
layer = "L1"
writer = "EXTERNAL issuer"
establishes = "Who delegated what scope to whom, as the issuer recorded it"
cannot = "That a call used the scope for the delegated purpose"
[[mechanism]]
name = "Policy decision (OPA, Cedar)"
layer = "L2"
writer = "PEER (the decider)"
establishes = "The decision for the input the decider was given"
cannot = "That the input described the real action, or that the action went through the decider"
[[mechanism]]
name = "Gateway or proxy mediation"
layer = "L2"
writer = "PEER (the gateway operator)"
establishes = "Requests and responses that crossed the gateway"
cannot = "Traffic that took another path, or effects downstream of the response"
[[mechanism]]
name = "OS sandbox (seccomp, Landlock, Bubblewrap)"
layer = "L3"
writer = "none by default"
establishes = "A bound on system calls and paths, if configured as claimed"
cannot = "That it was configured as claimed for a given run"
[[mechanism]]
name = "User-space kernel or microVM (gVisor, Firecracker, Kata)"
layer = "L3"
writer = "none by default"
establishes = "A stronger isolation boundary than a shared kernel"
cannot = "What ran inside it"
[[mechanism]]
name = "Platform attestation (a TEE or measured-boot quote)"
layer = "L3"
writer = "EXTERNAL (the hardware root), about launch state"
establishes = "The measured software state at launch"
cannot = "Behavior after launch"
[[mechanism]]
name = "Distributed trace (OpenTelemetry)"
layer = "L4"
writer = "SELF"
establishes = "What the instrumented code reported"
cannot = "Occurrence independent of the emitter, completeness, or integrity"
[[mechanism]]
name = "Signed statement in an envelope (in-toto, DSSE)"
layer = "L5"
writer = "whoever holds the key"
establishes = "The key holder signed exactly these bytes"
cannot = "That the key holder observed what the bytes describe"
[[mechanism]]
name = "Canonicalization (RFC 8785)"
layer = "L5"
writer = "not a record"
establishes = "One byte form per JSON value, so signatures agree across implementations"
cannot = "That two parsers read the same document the same way, unless inputs with two readings are refused first"
[[mechanism]]
name = "Transparency log (Rekor, Certificate Transparency, SCITT)"
layer = "L5"
writer = "EXTERNAL log operator, about submissions"
establishes = "An entry was included, and the log's history was not rewritten"
cannot = "That everything that should have been submitted was"
[[mechanism]]
name = "Trusted timestamp (RFC 3161)"
layer = "L5"
writer = "EXTERNAL time authority"
establishes = "The bytes existed before a time"
cannot = "When the described event happened"
[[mechanism]]
name = "Build provenance (SLSA)"
layer = "L5"
writer = "the builder"
establishes = "The builder's claims about how an artifact was built"
cannot = "How the artifact behaves at runtime"
[[mechanism]]
name = "Benchmark or red-team evaluation (Inspect, garak, promptfoo)"
layer = "L6"
writer = "PEER or EXTERNAL evaluator"
establishes = "Behavior of the tested version on the tested tasks"
cannot = "That the deployed system is the tested one, or behavior on untested tasks"
[[mechanism]]
name = "Embedded third-party evaluator (AEF-1 conditions)"
layer = "L6"
writer = "EXTERNAL evaluator, with the lab's access"
establishes = "An outside assessment of practices and incidents the evaluator could see"
cannot = "Events for which no trustworthy record exists"
[[mechanism]]
name = "Conformance test vectors"
layer = "L6"
writer = "the corpus maintainer"
establishes = "Independent implementations give the same answers on the same cases"
cannot = "That an implementation computed its answers rather than printed a known key"
[[mechanism]]
name = "Regulatory obligation or standard"
layer = "L7"
writer = "not a record"
establishes = "What must be shown, and to whom"
cannot = "That it was shown"
[[mechanism]]
name = "Record from an observer outside the agent's reach (the open cell)"
layer = "open"
writer = "EXTERNAL"
establishes = "An action as seen from a vantage the agent could not address, bound to what was observed"
cannot = "Actions outside the declared coverage, or the observer's own honesty"

# ---------------------------------------------------------------- artifacts
[[artifact]]
name = "agent-evidence-vocabulary"
url = "https://github.com/probityai/agent-evidence-vocabulary"
layers = "5, feeding 7"
release = "v0.3.0"
label = "draft"
does = "A closed, versioned vocabulary for what an evidence claim means: observer vantage, directness, witness scope (self, peer, external), coverage denominator, and what the record does not assert"
does_not = "It defines words. It neither verifies nor observes anything"
[[artifact]]
name = "agent-evidence-vectors"
url = "https://github.com/probityai/agent-evidence-vectors"
layers = "5 into 6"
release = "v0.13.0"
label = "published"
does = "A conformance corpus of 817 vectors in 13 corpora at v0.13.0, a reference verifier, a GitHub Action and a PyPI package"
does_not = "It does not observe execution. A clean run shows a verifier printed the right answers, not that it computed them"
[[artifact]]
name = "agent-evidence-admission"
url = "https://github.com/probityai/agent-evidence-admission"
layers = "2, consuming 5"
release = "no release yet"
label = "draft"
does = "Admission rules in four policy engines (OPA, two Kyverno dialects, and Sigstore's policy-controller) that admit or refuse a workload on its execution evidence"
does_not = "\"These rails evaluate an already-verified statement. They do not verify one.\""
[[artifact]]
name = "jcs-admit"
url = "https://crates.io/crates/jcs-admit"
layers = "5, bytes"
release = "0.1.0 on crates.io"
label = "published"
does = "Refuses JSON with more than one reading (duplicate members, excess nesting, invalid strings) before RFC 8785 canonicalization"
does_not = "It hands number formatting to another crate"
[[artifact]]
name = "dsse"
url = "https://crates.io/crates/dsse"
layers = "5, envelope"
release = "0.1.0 on crates.io"
label = "published"
does = "A standalone Rust implementation of the DSSE envelope that refuses six permissive behaviors"
does_not = "\"Implements the envelope and nothing else\"; key management is out of scope"

