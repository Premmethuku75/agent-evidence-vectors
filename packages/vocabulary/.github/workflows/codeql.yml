# CodeQL -- static analysis of the only two things in this repository CodeQL can
# actually read.
#
# Be clear about the size of that: this repository is a YAML registry, Markdown
# governance documents, and one Python file. CodeQL analyzes neither YAML data
# nor Markdown, so the real surface is:
#   - python  -- scripts/validate_crosswalks.py, which parses untrusted
#     contributor-supplied YAML and resolves URLs cited in a crosswalk. That is
#     a genuine input-handling surface and worth scanning.
#   - actions -- these workflow files themselves, for injection and
#     over-permissioned token patterns.
# No other language is configured, because no other language is here. If a
# crosswalk-rendering or publishing tool is added later in another language, add
# it to the matrix then rather than pre-declaring it now.
#
# While this repository is private, the code-scanning upload needs GitHub
# Advanced Security. Nothing here changes when it goes public.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
