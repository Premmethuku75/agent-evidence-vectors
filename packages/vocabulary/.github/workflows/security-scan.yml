name: security scan

# The scan in validate.yml runs on every push and pull request, but a pinned
# requirement can become vulnerable when an advisory is published AFTER the
# last commit. A repository whose prose changes once a month would learn about
# it at the next prose change. This re-resolves the same pinned requirement
# against the OSV database weekly, with the same fail-on-any-advisory policy,
# so the gap between disclosure and discovery is a week, never a release cycle.

on:
  schedule:
    # Mondays 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV scan (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Vulnerability scan (requirements.txt against OSV)
        # Same invocation as validate.yml so the two gates cannot disagree.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.3.8 --repo google/osv-scanner \
            --pattern osv-scanner_linux_amd64 --output ./osv-scanner --clobber
          chmod +x ./osv-scanner
          ./osv-scanner scan source --lockfile=requirements.txt
